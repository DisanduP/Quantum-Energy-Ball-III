<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Energy Orb</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Courier New', monospace;
        }
        
        canvas {
            display: block;
        }
        
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(transparent 50%, rgba(0, 255, 255, 0.03) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 5;
            animation: scan 8s linear infinite;
        }
        
        @keyframes scan {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }
        
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            z-index: 5;
        }
        
        .info {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #fff;
            z-index: 10;
            animation: glitchIn 0.8s ease-out;
        }
        
        @keyframes glitchIn {
            0%, 10%, 20% {
                transform: translate(-2px, 2px);
                opacity: 0;
            }
            15%, 25% {
                transform: translate(2px, -2px);
            }
            100% {
                transform: translate(0, 0);
                opacity: 1;
            }
        }
        
        .info h1 {
            font-size: 2.8em;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #ffff00, #00ffff);
            background-size: 300% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s linear infinite;
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.8));
        }
        
        @keyframes gradientShift {
            to { background-position: 300% center; }
        }
        
        .info .subtitle {
            font-size: 0.9em;
            color: #00ffff;
            letter-spacing: 2px;
            opacity: 0.8;
            text-transform: uppercase;
        }
        
        .info p {
            font-size: 0.85em;
            opacity: 0.6;
            color: #00ffff;
            margin-top: 10px;
        }
        
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 10;
            animation: slideUp 1s ease-out 0.3s both;
        }
        
        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .controls button {
            padding: 14px 28px;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.5);
            color: #00ffff;
            cursor: pointer;
            border-radius: 0;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            font-size: 0.75em;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        
        .controls button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .controls button:hover::before {
            left: 100%;
        }
        
        .controls button:hover {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.6), inset 0 0 30px rgba(0, 255, 255, 0.1);
            transform: translateY(-3px);
            border-color: rgba(0, 255, 255, 1);
        }
        
        .controls button:active {
            transform: translateY(-1px);
        }
        
        .stats {
            position: absolute;
            top: 30px;
            right: 30px;
            color: #00ffff;
            z-index: 10;
            text-align: right;
            font-size: 0.75em;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            animation: fadeIn 1s ease-out 0.5s both;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .stats div {
            margin: 8px 0;
            padding: 8px 15px;
            background: rgba(0, 255, 255, 0.05);
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }
        
        .stats .value {
            color: #fff;
            font-weight: 900;
            font-size: 1.2em;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }
        
        .mode-indicator {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: #ff00ff;
            z-index: 10;
            font-size: 0.8em;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 10px 20px;
            background: rgba(255, 0, 255, 0.1);
            border: 2px solid rgba(255, 0, 255, 0.5);
            backdrop-filter: blur(10px);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div class="vignette"></div>
    
    <div class="info">
        <h1>QUANTUM SPHERE</h1>
        <div class="subtitle">Energy Matrix v3.0</div>
        <p>MOVE • SCROLL • INTERACT</p>
    </div>
    
    <div class="stats">
        <div>PARTICLES <span class="value" id="particleCount">8000</span></div>
        <div>ENERGY <span class="value" id="energy">100%</span></div>
        <div>FREQUENCY <span class="value" id="freq">1.0Hz</span></div>
    </div>
    
    <div class="mode-indicator" id="modeIndicator">
        STANDARD MODE
    </div>
    
    <div class="controls">
        <button id="colorBtn">◆ SHIFT</button>
        <button id="speedBtn">⚡ BOOST</button>
        <button id="explodeBtn">✦ PULSE</button>
        <button id="modeBtn">◈ MORPH</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let particleSystems = [];
        let coreGlow, innerCore;
        let energyRings = [];
        let lightningLines = [];
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let colorIndex = 0;
        let speedMultiplier = 1;
        let energyLevel = 1;
        let cameraShake = 0;
        let morphMode = 0; // 0: sphere, 1: spiral, 2: cube
        
        const colorSchemes = [
            { inner: 0x00ffff, outer: 0xff00ff, accent: 0xffff00 },
            { inner: 0xff0080, outer: 0x00ff80, accent: 0x80ff00 },
            { inner: 0xffff00, outer: 0xff0000, accent: 0xff8800 },
            { inner: 0x00ff00, outer: 0x0000ff, accent: 0x0088ff },
            { inner: 0xff00ff, outer: 0x00ffff, accent: 0xff0088 },
            { inner: 0xff6600, outer: 0x00ffff, accent: 0x00ff00 }
        ];

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0015);
            
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 70;
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 1);
            document.body.appendChild(renderer.domElement);
            
            createParticleLayers();
            createCore();
            createEnergyRings();
            createLightning();
            createLights();
            
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('wheel', onMouseWheel);
            document.getElementById('colorBtn').addEventListener('click', changeColor);
            document.getElementById('speedBtn').addEventListener('click', toggleSpeed);
            document.getElementById('explodeBtn').addEventListener('click', pulseEffect);
            document.getElementById('modeBtn').addEventListener('click', changeMorphMode);
            window.addEventListener('resize', onWindowResize);
            
            animate();
        }
        
        function createParticleLayers() {
            // Main particle layer
            createParticleSystem(5000, 25, 1.2, 0.9);
            // Inner fast layer
            createParticleSystem(2000, 12, 0.8, 1.0);
            // Outer slow layer
            createParticleSystem(1000, 35, 1.5, 0.7);
        }
        
        function createParticleSystem(count, maxRadius, size, opacity) {
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const sizes = new Float32Array(count);
            const velocities = new Float32Array(count * 3);
            const phases = new Float32Array(count);
            
            const color1 = new THREE.Color(colorSchemes[colorIndex].inner);
            const color2 = new THREE.Color(colorSchemes[colorIndex].outer);
            const color3 = new THREE.Color(colorSchemes[colorIndex].accent);
            
            for (let i = 0; i < count; i++) {
                const radius = Math.random() * maxRadius + 5;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                
                positions[i * 3] = radius * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = radius * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = radius * Math.cos(phi);
                
                velocities[i * 3] = (Math.random() - 0.5) * 0.03;
                velocities[i * 3 + 1] = (Math.random() - 0.5) * 0.03;
                velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.03;
                
                phases[i] = Math.random() * Math.PI * 2;
                
                const mixRatio = radius / (maxRadius + 5);
                const color = color1.clone().lerp(color2, mixRatio * 0.7).lerp(color3, mixRatio * 0.3);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                
                sizes[i] = Math.random() * size + 0.3;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            geometry.velocities = velocities;
            geometry.phases = phases;
            geometry.maxRadius = maxRadius;
            
            const material = new THREE.PointsMaterial({
                size: size,
                vertexColors: true,
                transparent: true,
                opacity: opacity,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });
            
            const system = new THREE.Points(geometry, material);
            particleSystems.push(system);
            scene.add(system);
        }
        
        function createCore() {
            // Inner pulsing core
            const innerGeo = new THREE.SphereGeometry(2, 32, 32);
            const innerMat = new THREE.MeshBasicMaterial({
                color: colorSchemes[colorIndex].accent,
                transparent: true,
                opacity: 1,
                blending: THREE.AdditiveBlending
            });
            innerCore = new THREE.Mesh(innerGeo, innerMat);
            scene.add(innerCore);
            
            // Main glow
            const geometry = new THREE.SphereGeometry(4, 32, 32);
            const material = new THREE.MeshBasicMaterial({
                color: colorSchemes[colorIndex].inner,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });
            coreGlow = new THREE.Mesh(geometry, material);
            scene.add(coreGlow);
            
            // Multiple glow layers
            for (let i = 1; i <= 3; i++) {
                const glowGeometry = new THREE.SphereGeometry(4 + i * 2, 32, 32);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: colorSchemes[colorIndex].inner,
                    transparent: true,
                    opacity: 0.3 / i,
                    blending: THREE.AdditiveBlending
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                coreGlow.add(glow);
            }
        }
        
        function createEnergyRings() {
            for (let i = 0; i < 5; i++) {
                const geometry = new THREE.TorusGeometry(12 + i * 6, 0.2, 16, 100);
                const material = new THREE.MeshBasicMaterial({
                    color: i % 2 === 0 ? colorSchemes[colorIndex].inner : colorSchemes[colorIndex].outer,
                    transparent: true,
                    opacity: 0.5,
                    blending: THREE.AdditiveBlending
                });
                const ring = new THREE.Mesh(geometry, material);
                ring.rotation.x = Math.random() * Math.PI;
                ring.rotation.y = Math.random() * Math.PI;
                ring.rotationSpeed = {
                    x: (Math.random() - 0.5) * 0.02,
                    y: (Math.random() - 0.5) * 0.02,
                    z: (Math.random() - 0.5) * 0.02
                };
                energyRings.push(ring);
                scene.add(ring);
            }
        }
        
        function createLightning() {
            for (let i = 0; i < 30; i++) {
                const geometry = new THREE.BufferGeometry();
                const material = new THREE.LineBasicMaterial({
                    color: colorSchemes[colorIndex].accent,
                    transparent: true,
                    opacity: 0,
                    blending: THREE.AdditiveBlending,
                    linewidth: 2
                });
                const line = new THREE.Line(geometry, material);
                line.active = false;
                lightningLines.push(line);
                scene.add(line);
            }
        }
        
        function createLights() {
            const ambientLight = new THREE.AmbientLight(0x111111);
            scene.add(ambientLight);
            
            const light1 = new THREE.PointLight(colorSchemes[colorIndex].inner, 3, 150);
            light1.position.set(0, 0, 0);
            scene.add(light1);
            
            const light2 = new THREE.PointLight(colorSchemes[colorIndex].outer, 2, 150);
            light2.position.set(40, 40, 40);
            scene.add(light2);
            
            const light3 = new THREE.PointLight(colorSchemes[colorIndex].accent, 2, 150);
            light3.position.set(-40, -40, 40);
            scene.add(light3);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = Date.now() * 0.001 * speedMultiplier;
            
            targetX += (mouseX - targetX) * 0.05;
            targetY += (mouseY - targetY) * 0.05;
            
            // Camera shake
            if (cameraShake > 0) {
                camera.position.x += (Math.random() - 0.5) * cameraShake;
                camera.position.y += (Math.random() - 0.5) * cameraShake;
                cameraShake *= 0.9;
            }
            
            // Animate particle systems
            particleSystems.forEach((system, index) => {
                const speedMod = (index + 1) * 0.15;
                system.rotation.y = time * speedMod;
                system.rotation.x = targetY * 0.3 + Math.sin(time * 0.5) * 0.1;
                system.rotation.z = targetX * 0.2 + Math.cos(time * 0.3) * 0.1;
                
                const positions = system.geometry.attributes.position.array;
                const velocities = system.geometry.velocities;
                const phases = system.geometry.phases;
                const maxRadius = system.geometry.maxRadius;
                
                for (let i = 0; i < positions.length; i += 3) {
                    const x = positions[i];
                    const y = positions[i + 1];
                    const z = positions[i + 2];
                    
                    const radius = Math.sqrt(x * x + y * y + z * z);
                    const pulse = Math.sin(time * 2 + phases[i / 3] + radius * 0.2) * 0.4 * energyLevel;
                    
                    // Different behavior based on morph mode
                    if (morphMode === 0) {
                        // Sphere mode
                        positions[i] += velocities[i] + Math.sin(time + phases[i / 3]) * 0.04;
                        positions[i + 1] += velocities[i + 1] + Math.cos(time + phases[i / 3]) * 0.04;
                        positions[i + 2] += velocities[i + 2] + Math.sin(time * 0.7 + phases[i / 3]) * 0.04;
                        
                        const targetRadius = maxRadius * 0.6 + Math.sin(time + phases[i / 3] * 0.1) * maxRadius * 0.3;
                        if (radius > targetRadius + 8 || radius < targetRadius - 8) {
                            positions[i] *= 0.98;
                            positions[i + 1] *= 0.98;
                            positions[i + 2] *= 0.98;
                        }
                    } else if (morphMode === 1) {
                        // Spiral mode
                        const angle = time + phases[i / 3];
                        const spiralRadius = radius + Math.sin(angle * 2) * 3;
                        positions[i] = spiralRadius * Math.cos(angle + i * 0.01);
                        positions[i + 1] += velocities[i + 1] * 2;
                        positions[i + 2] = spiralRadius * Math.sin(angle + i * 0.01);
                        
                        if (Math.abs(positions[i + 1]) > 40) {
                            positions[i + 1] *= -0.8;
                        }
                    } else {
                        // Cube mode
                        const cubeSize = 20;
                        positions[i] += velocities[i] * 2;
                        positions[i + 1] += velocities[i + 1] * 2;
                        positions[i + 2] += velocities[i + 2] * 2;
                        
                        if (Math.abs(positions[i]) > cubeSize) positions[i] = Math.sign(positions[i]) * cubeSize;
                        if (Math.abs(positions[i + 1]) > cubeSize) positions[i + 1] = Math.sign(positions[i + 1]) * cubeSize;
                        if (Math.abs(positions[i + 2]) > cubeSize) positions[i + 2] = Math.sign(positions[i + 2]) * cubeSize;
                    }
                    
                    // Pulsing
                    const normalizedX = x / (radius || 1);
                    const normalizedY = y / (radius || 1);
                    const normalizedZ = z / (radius || 1);
                    
                    positions[i] += normalizedX * pulse * 0.6;
                    positions[i + 1] += normalizedY * pulse * 0.6;
                    positions[i + 2] += normalizedZ * pulse * 0.6;
                }
                
                system.geometry.attributes.position.needsUpdate = true;
            });
            
            // Animate core
            innerCore.rotation.x += 0.02 * speedMultiplier;
            innerCore.rotation.y += 0.03 * speedMultiplier;
            const coreScale = 1 + Math.sin(time * 3) * 0.15;
            innerCore.scale.set(coreScale, coreScale, coreScale);
            
            coreGlow.rotation.x += 0.01 * speedMultiplier;
            coreGlow.rotation.y += 0.02 * speedMultiplier;
            const glowScale = 1 + Math.sin(time * 2) * 0.1;
            coreGlow.scale.set(glowScale, glowScale, glowScale);
            
            // Animate rings
            energyRings.forEach((ring, i) => {
                ring.rotation.x += ring.rotationSpeed.x * speedMultiplier;
                ring.rotation.y += ring.rotationSpeed.y * speedMultiplier;
                ring.rotation.z += ring.rotationSpeed.z * speedMultiplier;
                const ringScale = 1 + Math.sin(time * 1.5 + i) * 0.08;
                ring.scale.set(ringScale, ringScale, ringScale);
            });
            
            // Lightning effects
            if (Math.random() < 0.05 * speedMultiplier) {
                triggerLightning();
            }
            
            lightningLines.forEach(line => {
                if (line.material.opacity > 0) {
                    line.material.opacity *= 0.85;
                }
            });
            
            // Update stats
            energyLevel = 1 + Math.sin(time * 1.5) * 0.3;
            document.getElementById('energy').textContent = Math.floor(energyLevel * 100) + '%';
            document.getElementById('freq').textContent = (speedMultiplier * 1.0).toFixed(1) + 'Hz';
            
            renderer.render(scene, camera);
        }
        
        function triggerLightning() {
            const line = lightningLines.find(l => l.material.opacity < 0.1);
            if (!line) return;
            
            const positions = [];
            const particlePos = particleSystems[0].geometry.attributes.position.array;
            const idx1 = Math.floor(Math.random() * (particlePos.length / 3)) * 3;
            const idx2 = Math.floor(Math.random() * (particlePos.length / 3)) * 3;
            
            positions.push(
                particlePos[idx1], particlePos[idx1 + 1], particlePos[idx1 + 2],
                particlePos[idx2], particlePos[idx2 + 1], particlePos[idx2 + 2]
            );
            
            line.geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            line.material.opacity = 0.8;
        }
        
        function changeColor() {
            colorIndex = (colorIndex + 1) % colorSchemes.length;
            
            particleSystems.forEach(system => {
                const colors = system.geometry.attributes.color.array;
                const positions = system.geometry.attributes.position.array;
                const maxRadius = system.geometry.maxRadius;
                const color1 = new THREE.Color(colorSchemes[colorIndex].inner);
                const color2 = new THREE.Color(colorSchemes[colorIndex].outer);
                const color3 = new THREE.Color(colorSchemes[colorIndex].accent);
                
                for (let i = 0; i < positions.length; i += 3) {
                    const x = positions[i];
                    const y = positions[i + 1];
                    const z = positions[i + 2];
                    const radius = Math.sqrt(x * x + y * y + z * z);
                    const mixRatio = radius / (maxRadius + 5);
                    const color = color1.clone().lerp(color2, mixRatio * 0.7).lerp(color3, mixRatio * 0.3);
                    
                    colors[i] = color.r;
                    colors[i + 1] = color.g;
                    colors[i + 2] = color.b;
                }
                
                system.geometry.attributes.color.needsUpdate = true;
            });
            
            innerCore.material.color.setHex(colorSchemes[colorIndex].accent);
            coreGlow.material.color.setHex(colorSchemes[colorIndex].inner);
            energyRings.forEach((ring, i) => {
                ring.material.color.setHex(i % 2 === 0 ? colorSchemes[colorIndex].inner : colorSchemes[colorIndex].outer);
            });
            lightningLines.forEach(line => {
                line.material.color.setHex(colorSchemes[colorIndex].accent);
            });
        }
        
        function toggleSpeed() {
            speedMultiplier = speedMultiplier < 2 ? speedMultiplier + 0.5 : 1;
        }
        
        function pulseEffect() {
            cameraShake = 2;
            
            particleSystems.forEach(system => {
                const positions = system.geometry.attributes.position.array;
                
                for (let i = 0; i < positions.length; i += 3) {
                    positions[i] *= 1.4;
                    positions[i + 1] *= 1.4;
                    positions[i + 2] *= 1.4;
                }
                
                system.geometry.attributes.position.needsUpdate = true;
            });
            
            for (let i = 0; i < 10; i++) {
                setTimeout(() => triggerLightning(), i * 50);
            }
            
            setTimeout(() => {
                particleSystems.forEach(system => {
                    const positions = system.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length; i += 3) {
                        positions[i] *= 0.71;
                        positions[i + 1] *= 0.71;
                        positions[i + 2] *= 0.71;
                    }
                    system.geometry.attributes.position.needsUpdate = true;
                });
            }, 300);
        }
        
        function changeMorphMode() {
            morphMode = (morphMode + 1) % 3;
            const modes = ['STANDARD MODE', 'SPIRAL MODE', 'CUBE MODE'];
            document.getElementById('modeIndicator').textContent = modes[morphMode];
        }
        
        function onMouseMove(e) {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        }
        
        function onMouseWheel(e) {
            camera.position.z += e.deltaY * 0.05;
            camera.position.z = Math.max(30, Math.min(120, camera.position.z));
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        init();
    </script>
</body>
</html>
